<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Playerok Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0f1115; --bg-card: #1c1f26; --text-main: #ffffff;
            --text-muted: #8b92a5; --accent-blue: #3b72f6; --border-color: #2a2e38;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: -apple-system, sans-serif; padding-bottom: 90px; overflow-x: hidden; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background-color: var(--bg-main); z-index: 10; }
        .logo { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .logo::before { content: ''; display: block; width: 12px; height: 12px; background-color: #a88bfc; border-radius: 50%; }
        
        .page { display: none; padding: 0 16px; }
        .page.active { display: block; }
        
        .card { background-color: var(--bg-card); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .profile-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background-color: #000; display: flex; justify-content: center; align-items: center; font-size: 24px; border: 1px solid var(--border-color); }
        
        .balance-title { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
        .balance-amount { font-size: 36px; font-weight: bold; margin-bottom: 12px; }
        .balance-sub { display: flex; gap: 16px; font-size: 14px; margin-bottom: 20px; font-weight: 500; }
        
        .btn-row { display: flex; gap: 12px; }
        .btn { background-color: var(--accent-blue); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border-color); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background-color: rgba(28, 31, 38, 0.95); display: flex; justify-content: space-around; align-items: center; padding: 8px 0 20px 0; border-top: 1px solid var(--border-color); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; gap: 4px; cursor: pointer; }
        .nav-item.active { color: var(--accent-blue); }
        .nav-plus { width: 48px; height: 48px; background-color: var(--accent-blue); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; margin-top: -20px; }
    </style>
</head>
<body>
    <header><div class="logo">Playerok</div></header>

    <!-- ГЛАВНАЯ -->
    <div id="page-home" class="page active">
        <div class="card" style="background: linear-gradient(180deg, #151a27 0%, #10131c 100%);">
            <div class="profile-header">
                <div class="avatar">🕵️</div>
                <div class="profile-info">
                    <h3 id="user-name">Загрузка...</h3>
                    <p id="user-tag">@username</p>
                </div>
            </div>
            <div class="balance-title">Баланс</div>
            <!-- ЗДЕСЬ БУДУТ НУЛИ, ПОКА БОТ НЕ ПЕРЕДАСТ ДАННЫЕ -->
            <div class="balance-amount" id="ui-balance-rub">0,00 ₽</div>
            <div class="balance-sub">
                <span id="ui-balance-stars">0 ⭐</span>
                <span id="ui-balance-ton">0 TON</span>
            </div>
            <div class="btn-row">
                <button class="btn" onclick="tg.showAlert('Пополнение в боте: /up')">Пополнить</button>
                <button class="btn btn-outline">Вывести</button>
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ (УПРОЩЕННАЯ) -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('home', this)">Главная</div>
        <div class="nav-plus">+</div>
        <div class="nav-item" onclick="tg.showAlert('В разработке')">Профиль</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0f1115');
        tg.setBackgroundColor('#0f1115');

        function switchPage(pageId, navElement) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
        }

        let user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name || 'Пользователь';
            document.getElementById('user-tag').innerText = user.username ? '@' + user.username : '';
        }

        // ЧИТАЕМ ДАННЫЕ ИЗ ССЫЛКИ (которую генерирует бот)
        const urlParams = new URLSearchParams(window.location.search);
        
        // Если параметров нет, ставим нули. Если есть - берем из ссылки.
        let rub = urlParams.get('rub') || '0';
        let stars = urlParams.get('stars') || '0';
        let ton = urlParams.get('ton') || '0';

        // Форматируем красиво
        document.getElementById('ui-balance-rub').innerText = parseFloat(rub).toLocaleString('ru-RU', { minimumFractionDigits: 2 }) + ' ₽';
        document.getElementById('ui-balance-stars').innerText = stars + ' ⭐';
        document.getElementById('ui-balance-ton').innerText = ton + ' TON';
    </script>
</body>
</html>
