<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лёня</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #111;
            border: 1px solid #1f1f1f;
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.05);
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4444, #ff8800);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #000;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .tagline {
            color: #ff4444;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .desc {
            color: #aaa;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .emoji {
            font-size: 40px;
            margin: 20px 0;
        }
        .footer {
            margin-top: 28px;
            color: #333;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">Л</div>
        <h1>Лёня</h1>
        <div class="tagline">Гей-шалун</div>
        <div class="emoji">🏳️‍🌈</div>
        <div class="desc">
            Лёня ещё на арматуре скачет,<br>
            как настоящий гей-шалун.
        </div>
        <div class="footer">© 2026 Лёня</div>
    </div>
</body>
</html>
