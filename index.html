<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoIronik — Цифровые активы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #111;
            border: 1px solid #1f1f1f;
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.05);
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff88, #0088ff);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #000;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .tagline {
            color: #00ff88;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .desc {
            color: #aaa;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            background: #00ff88;
            color: #000;
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #00cc6a;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 28px;
            color: #333;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">₿</div>
        <h1>CryptoIronik</h1>
        <div class="tagline">Цифровые активы · NFT</div>
        <div class="desc">
            Скупаю и перепродаю цифровую валюту и NFT.<br>
            Быстрые сделки, честные цены, конфиденциальность.
        </div>
        <a href="https://t.me/cryptoironik" class="btn" target="_blank">Связаться →</a>
        <div class="footer">© 2026 CryptoIronik</div>
    </div>
</body>
</html>
