<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gram Wallet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root { --bg:#000; --panel:#0e0f11; --panel2:#17181b; --line:#2a2c31; --ink:#fff; --mut:#8a8d96; --blue:#4c94f0; --blue2:#2f7ee8; --green:#43d17a; --red:#ff6b7c; --safe:env(safe-area-inset-bottom); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
body { min-height:100vh; overflow-x:hidden; }
button,input { font:inherit; color:inherit; } button { border:0; background:none; cursor:pointer; }
.i { width:24px; height:24px; flex:none; display:inline-block; vertical-align:middle; }
#app { max-width:520px; margin:0 auto; padding:12px 14px calc(30px + var(--safe)); min-height:100vh; display:flex; flex-direction:column; }
.glow { position:fixed; left:50%; top:210px; width:520px; height:300px; transform:translateX(-50%); background:radial-gradient(closest-side,rgba(47,126,232,.28),transparent); filter:blur(30px); pointer-events:none; z-index:-1; }

/* шапка */
.top { position:relative; display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.top h1 { font-size:19px; font-weight:700; margin:0; position:absolute; left:50%; transform:translateX(-50%); }
.rbtn { height:42px; min-width:42px; border-radius:21px; background:#0f1012; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
.rbtn.pill { padding:0 4px; gap:0; } .rbtn.pill button { width:44px; height:40px; display:grid; place-items:center; }
.rbtn:active, .rbtn button:active { opacity:.6; }

/* карта */
.card { position:relative; height:196px; border-radius:30px; padding:22px 22px 20px; overflow:hidden; color:#fff;
  background:linear-gradient(155deg,#55adff 0%,#2a85ff 45%,#1568f2 100%); border:1px solid rgba(255,255,255,.4);
  box-shadow:0 0 70px -6px rgba(47,126,232,.7), inset 0 2px 0 rgba(255,255,255,.45), inset 0 -20px 40px rgba(0,60,200,.25); }
.card::before { content:""; position:absolute; inset:0; background:radial-gradient(120% 70% at 10% -10%,rgba(255,255,255,.35),transparent 55%); }
.card::after { content:""; position:absolute; top:-40%; bottom:-40%; width:40%; left:-60%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent); transform:skewX(-18deg); animation:sweep 5s ease-in-out infinite; }
@keyframes sweep { 55%,100% { left:130%; } }
.card > * { position:relative; z-index:1; }
.bal { display:flex; align-items:center; gap:12px; margin-top:44px; }
.bal .gem { width:40px; height:40px; filter:drop-shadow(0 2px 6px rgba(0,40,160,.5)); }
.bal b { font-size:42px; font-weight:800; letter-spacing:-.02em; line-height:1; }
.bal span { font-size:28px; font-weight:700; color:rgba(220,235,255,.72); margin-left:-4px; }
.usd { font-size:16px; font-weight:600; color:rgba(255,255,255,.82); margin:6px 0 0 52px; }
.holder { position:absolute !important; left:22px; bottom:18px; font-size:18px; font-weight:800; letter-spacing:.05em; max-width:52%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.qrbtn { position:absolute !important; right:50px; top:50%; margin-top:-16px; width:58px; height:58px; border-radius:18px; background:rgba(255,255,255,.3); border:1px solid rgba(255,255,255,.5); display:grid; place-items:center; backdrop-filter:blur(6px); box-shadow:0 8px 20px -8px rgba(0,40,160,.6), inset 0 1px 0 rgba(255,255,255,.6); }
.qrbtn:active { transform:scale(.94); }
.vcode { position:absolute !important; right:16px; top:20px; display:flex; gap:4px; }
.vcode span { writing-mode:vertical-rl; font:600 11px/1.1 ui-monospace,Menlo,monospace; letter-spacing:.12em; color:rgba(255,255,255,.4); }

/* кнопки */
.actions { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:16px 0; }
.pbtn { height:54px; border-radius:27px; font-size:18px; font-weight:700; color:#fff; background:linear-gradient(180deg,#63a8f6,#4a90ea); border:1px solid rgba(255,255,255,.18);
  box-shadow:0 0 28px -4px rgba(76,148,240,.55), inset 0 1px 0 rgba(255,255,255,.35); transition:transform .1s, opacity .15s; }
.pbtn:active { transform:scale(.97); opacity:.9; } .pbtn:disabled { opacity:.45; }
.seg { display:flex; padding:4px; border-radius:30px; background:#0c0d0f; border:1px solid var(--line); margin-bottom:14px; }
.seg button { flex:1; height:50px; border-radius:26px; font-size:17px; font-weight:700; color:#6e7178; border:1px solid transparent; transition:.2s; }
.seg button.on { background:#3a3b40; color:#fff; border-color:#55575d; box-shadow:inset 0 1px 0 rgba(255,255,255,.14); }
.empty { text-align:center; padding:44px 24px 48px; border-radius:30px; background:#0b0c0e; border:1px solid #202226; }
.empty .ic { width:68px; height:68px; margin:0 auto 18px; border-radius:50%; background:#17181b; border:1px solid #2a2c31; display:grid; place-items:center; }
.empty h3 { margin:0 0 8px; font-size:19px; font-weight:700; } .empty p { margin:0; font-size:15px; color:#777a82; line-height:1.4; }
.list { border-radius:30px; background:#0b0c0e; border:1px solid #202226; overflow:hidden; }
.tx { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid #1b1d20; } .tx:last-child { border:0; }
.tx .ti { width:42px; height:42px; border-radius:14px; background:#17181b; border:1px solid #2a2c31; display:grid; place-items:center; flex:none; }
.tx .tt { flex:1; min-width:0; } .tx .tt b { display:block; font-size:15.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .tx .tt small { color:#7b7e86; font-size:12.5px; }
.tx .ta { font-weight:700; font-size:16px; white-space:nowrap; } .pos { color:var(--green); } .st { color:#e0b04a; font-size:12px; font-weight:600; }

/* экран отправки */
.lbl { font-size:14px; font-weight:800; letter-spacing:.06em; color:#8a8d96; margin:22px 4px 10px; text-transform:uppercase; }
.field { height:60px; border-radius:30px; background:#141517; border:1px solid #2c2e33; display:flex; align-items:center; padding:0 16px 0 24px; gap:10px; box-shadow:inset 0 2px 8px rgba(0,0,0,.4); }
.field:focus-within { border-color:var(--blue); box-shadow:0 0 0 3px rgba(76,148,240,.2); }
.field input { flex:1; min-width:0; background:none; border:0; outline:0; font-size:19px; }
.field input::placeholder { color:#6a6d74; }
.chip { height:40px; padding:0 18px; border-radius:20px; background:#1c2a40; color:#5aa2f6; font-weight:800; font-size:16px; }
.avail { text-align:center; margin:44px 0 0; color:#8a8d96; font-size:18px; } .avail b { color:var(--blue); }
.note { text-align:center; color:#9a9ea6; font-size:13.5px; line-height:1.45; margin:16px 10px 0; }
.spacer { flex:1; }
.bottom { position:sticky; bottom:calc(12px + var(--safe)); padding-top:16px; }
.bottom .pbtn { width:100%; height:58px; border-radius:29px; font-size:19px; }

/* шторки */
.backdrop { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.62); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); animation:fade .2s; }
@keyframes fade { from { opacity:0; } }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; max-width:520px; margin:0 auto; padding:10px 18px calc(20px + var(--safe)); border-radius:32px 32px 0 0; background:#1c1d21; border:1px solid #2c2e33; border-bottom:0;
  box-shadow:0 -20px 60px -20px rgba(47,126,232,.35); animation:rise .3s cubic-bezier(.2,.9,.3,1); max-height:94vh; overflow-y:auto; }
@keyframes rise { from { transform:translateY(100%); } }
.sheet::before { content:""; display:block; width:42px; height:5px; border-radius:5px; background:#4a4c52; margin:0 auto 18px; }
.sheet h2 { text-align:center; font-size:23px; font-weight:800; margin:0 0 8px; }
.sheet .sub { text-align:center; color:#8a8d96; font-size:16px; line-height:1.4; margin:0 6px 22px; }
.row { display:flex; align-items:center; gap:16px; width:100%; text-align:left; padding:16px 18px; margin-bottom:14px; border-radius:28px; background:#25262a; border:1px solid #34363b; transition:transform .1s; }
.row:active { transform:scale(.98); }
.row .ib { width:56px; height:56px; border-radius:18px; background:#303136; border:1px solid #3d3f45; display:grid; place-items:center; flex:none; }
.row .tx2 { flex:1; min-width:0; } .row .tx2 b { display:block; font-size:19.5px; font-weight:700; line-height:1.2; } .row .tx2 small { display:block; color:#85878d; font-size:14.5px; margin-top:3px; line-height:1.3; }
.row .chev { color:#7b7e86; }
.xbtn { width:100%; height:58px; border-radius:29px; border:1px solid #373a40; font-size:20px; font-weight:700; margin-top:6px; background:transparent; }
.xbtn:active { background:#25262a; }
.qr { width:208px; height:208px; margin:0 auto 22px; padding:14px; border-radius:30px; background:#fff; box-shadow:0 0 50px -8px rgba(76,148,240,.6); } .qr svg { width:100%; height:100%; display:block; }
.addr { padding:16px 18px; border-radius:24px; background:#232428; border:1px solid #303236; font:600 16.5px/1.5 ui-monospace,Menlo,monospace; letter-spacing:.04em; text-align:center; word-break:break-word; color:#dfe3ea; }
.memo { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:12px 0 16px; padding:12px 16px; border-radius:20px; background:rgba(224,176,74,.1); border:1px solid rgba(224,176,74,.35); font-size:14px; color:#e8c277; }
.memo b { font:700 16px ui-monospace,Menlo,monospace; color:#fff; }
.memo button { color:var(--blue); font-weight:700; }
.sheet .field { margin-bottom:16px; }
.toast { position:fixed; left:50%; bottom:calc(30px + var(--safe)); transform:translateX(-50%); z-index:40; padding:13px 18px; border-radius:18px; background:#26272b; border:1px solid #3a3c42; font-size:15px; font-weight:600; max-width:92%; text-align:center; animation:pop .25s; box-shadow:0 14px 40px -10px #000; }
@keyframes pop { from { opacity:0; transform:translate(-50%,14px); } }
.toast.err { border-color:#ff6b7c88; } .toast.ok { border-color:#43d17a88; }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }

/* ===== v2: премиальные кнопки ===== */
.pbtn,.row,.xbtn,.chip,.rbtn,.rbtn button,.seg button,.qrbtn { position:relative; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
.pbtn { background:linear-gradient(180deg,#7dbcff 0%,#4f98f2 46%,#2b7be6 100%); border:1px solid rgba(255,255,255,.34);
  box-shadow:0 12px 26px -10px rgba(47,126,232,.9), 0 0 34px -8px rgba(76,148,240,.7), inset 0 1.5px 0 rgba(255,255,255,.6), inset 0 -3px 8px rgba(8,50,150,.38); text-shadow:0 1px 2px rgba(0,40,120,.45); letter-spacing:.01em; }
.pbtn::before { content:""; position:absolute; left:2px; right:2px; top:1px; height:52%; border-radius:inherit; background:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,0)); pointer-events:none; }
.pbtn:active { transform:scale(.97) translateY(1px); box-shadow:0 5px 14px -8px rgba(47,126,232,.9), inset 0 1.5px 0 rgba(255,255,255,.45), inset 0 -2px 6px rgba(8,50,150,.4); }
.pbtn:disabled { opacity:.5; filter:saturate(.6); box-shadow:none; }
.xbtn { background:linear-gradient(180deg,#26272c,#1c1d21); border:1px solid #3b3e45; box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 6px 16px -10px #000; }
.xbtn:active { transform:scale(.98); background:#2a2b30; }
.row { background:linear-gradient(180deg,#2b2c31,#222327); border:1px solid #3a3c42; box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 8px 18px -12px #000; }
.row .ib { background:linear-gradient(180deg,#3a3b41,#2b2c31); box-shadow:inset 0 1px 0 rgba(255,255,255,.1); }
.chip { background:linear-gradient(180deg,#24395a,#1a2b46); box-shadow:inset 0 1px 0 rgba(120,180,255,.25), 0 0 16px -6px rgba(76,148,240,.6); }
.chip:active { transform:scale(.94); }
.rbtn { background:linear-gradient(180deg,#17181b,#0e0f11); } .rbtn:active { transform:scale(.95); }
.seg button.on { background:linear-gradient(180deg,#46474d,#34353a); }
.rip { position:absolute; border-radius:50%; background:rgba(255,255,255,.38); transform:scale(0); animation:rip .6s ease-out forwards; pointer-events:none; }
@keyframes rip { to { transform:scale(1); opacity:0; } }

/* карта: нажатие копирует адрес */
.card { cursor:pointer; transition:transform .12s; } .card:active { transform:scale(.99); }
.cp { position:absolute !important; right:16px; bottom:16px; display:flex; align-items:center; gap:6px; height:30px; padding:0 11px; border-radius:15px; background:rgba(0,0,0,.24); border:1px solid rgba(255,255,255,.28); font:600 12.5px ui-monospace,Menlo,monospace; letter-spacing:.03em; backdrop-filter:blur(6px); }

/* песочные часы */
.empty .ic { width:84px; height:84px; background:radial-gradient(circle at 50% 35%,#24262b,#141518 70%); box-shadow:0 0 30px -8px rgba(240,179,35,.35), inset 0 1px 0 rgba(255,255,255,.08); }
.hg { overflow:visible; transform-origin:50% 60%; animation:hgSway 5s ease-in-out infinite; filter:drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
@keyframes hgSway { 50% { transform:rotate(4deg); } }
.hg-top { animation:hgDrain 7s linear infinite; }
@keyframes hgDrain { 0% { transform:translateY(0); opacity:1; } 88% { transform:translateY(21px); opacity:1; } 100% { transform:translateY(21px); opacity:0; } }
.hg-bot { transform-origin:32px 53px; animation:hgFill 7s linear infinite; }
@keyframes hgFill { 0% { transform:scaleY(.05); opacity:1; } 88% { transform:scaleY(1); opacity:1; } 100% { transform:scaleY(1); opacity:0; } }
.hg-stream { animation:hgFlow .55s linear infinite; }
@keyframes hgFlow { to { stroke-dashoffset:-4; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gGem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bff1ff"/><stop offset=".5" stop-color="#4dc3ff"/><stop offset="1" stop-color="#1a7bff"/></linearGradient>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 5.5-6.5 6.5 6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<div class="glow" aria-hidden="true"></div>
<div id="app"></div>
<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" hidden></section>
<div class="toast" id="toast" hidden></div>

<script>
// ============ Gram Wallet — Telegram Mini App (один файл) ============
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.('#000000'); tg.setBackgroundColor?.('#000000'); tg.disableVerticalSwipes?.(); }
// Если запускаете БЕЗ сервера — вставьте сюда адрес кошелька сервиса (иначе адрес не будет показан)
const LOCAL_TON_ADDRESS = '';
const NANO = 1e9;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, s = 24, c = '') => `<svg class="i ${c}" style="width:${s}px;height:${s}px"><use href="#i-${n}"/></svg>`;

const hourglass = () => `<svg class="hg" viewBox="0 0 64 64" width="46" height="46" aria-hidden="true"><defs>

async function apiReal(path, body) {
  let r;
  try { r = await fetch('/api' + path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg?.initData || '' }, body: body ? JSON.stringify(body) : undefined }); }
  catch { throw new Error('NO_BACKEND'); }
  if (!(r.headers.get('content-type') || '').includes('json')) throw new Error('NO_BACKEND');
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'SERVER_ERROR');
  return j;
}
async function api(path, body) {
  if (!state.local) { try { return await apiReal(path, body); } catch (e) { if (e.message !== 'NO_BACKEND') throw e; state.local = true; } }
  return Mock.call(path, body);
}
const Mock = (() => {
  const KEY = 'gw_local_v1', MIN = 1 * NANO, A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const tgu = tg?.initDataUnsafe?.user || {};
  const mkCode = (id) => { let h = 2166136261 ^ id, s = ''; for (let i = 0; i < 32; i++) { h = Math.imul(h ^ (i + 7), 16777619) >>> 0; h ^= h >>> 13; s += A[(h >>> 0) % 32]; } return s; };
  let S = null; try { S = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!S) { const id = tgu.id || 999; S = { me: { id, name: tgu.first_name || 'Wallet', username: tgu.username || null, code: mkCode(id), balance: 0 }, txs: [], redeemed: [], nid: 1 }; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
  const CHECKS = { WELCOME: 5 }, USERS = { '@alice': 1001, '@bob': 1002 };
  const tx = (type, amount, who, status) => { S.txs.unshift({ id: S.nid++, type, amount, counterparty: who || null, status: status || null, created: Math.floor(Date.now() / 1000) }); };
  const H = {
    '/config': () => ({ address: LOCAL_TON_ADDRESS, minWithdraw: MIN, rate: null }),
    '/wallet': () => { if (tgu.id) { S.me.name = tgu.first_name || S.me.name; S.me.username = tgu.username || null; } return { user: S.me, txs: S.txs.slice(0, 50) }; },
    '/lang': () => ({ ok: true }),
    '/deposit/check': () => ({ credited: 0 }),
    '/redeem': (b) => {
      const code = String(b.code || '').trim().toUpperCase(), v = CHECKS[code];
      if (!v) throw new Error('CHECK_INVALID'); if (S.redeemed.includes(code)) throw new Error('CHECK_USED');
      S.redeemed.push(code); S.me.balance += v * NANO; tx('check', v * NANO, code); return { amount: v * NANO };
    },
    '/send': (b) => {
      const amt = Math.round(Number(String(b.amount).replace(',', '.')) * NANO), to = String(b.to || '').trim().replace(/\s+/g, '');
      if (!(amt > 0) || !to) throw new Error('BAD_INPUT');
      if (/^[EU]Q[A-Za-z0-9_-]{46}$/.test(to)) { if (amt < MIN) throw new Error('MIN_WITHDRAW'); if (S.me.balance < amt) throw new Error('INSUFFICIENT'); S.me.balance -= amt; tx('withdraw', -amt, to.slice(0, 6) + '…' + to.slice(-4), 'pending'); return { pending: true }; }
      const key = to.toLowerCase(); if (key === '@' + String(S.me.username).toLowerCase()) throw new Error('SELF');
      if (!USERS[key]) throw new Error('NO_RECIPIENT'); if (S.me.balance < amt) throw new Error('INSUFFICIENT');
      S.me.balance -= amt; tx('transfer_out', -amt, key); return { ok: true };
    },
  };
  return { call(path, body) { const h = H[path]; if (!h) throw new Error('SERVER_ERROR'); const out = h(body || {}); save(); return JSON.parse(JSON.stringify(out)); } };
})();

}
function openRedeem(code = '') {
  openSheet(`<h2>${t('redeemTitle')}</h2><p class="sub">${t('redeemSub')}</p>
    <div class="field"><input id="cd" placeholder="${esc(t('redeemPh'))}" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(code)}"></div>
    <button class="pbtn" id="ok" style="width:100%;height:58px;border-radius:29px;font-size:19px">${t('redeemBtn')}</button>
    <button class="xbtn" id="cn" style="margin-top:12px">${t('cancel')}</button>`);
  $('#cn').onclick = closeSheet;
  $('#ok').onclick = async () => { const b = $('#ok'); b.disabled = true; try { const r = await api('/redeem', { code: $('#cd').value }); await refresh(); closeSheet(); toast(t('redeemOk', fmtG(r.amount)), 'ok'); renderHome(); } catch (e) { fail(e); b.disabled = false; } };
}
function openSettings() {
  openSheet(`<h2>${t('settings')}</h2><div style="height:14px"></div>
    <button class="row" id="lg"><span class="ib">${ic('globe', 28)}</span><span class="tx2"><b>${t('lang')}</b><small>${t('langCur')}</small></span></button>
    <button class="row" id="cp"><span class="ib">${ic('copy', 28)}</span><span class="tx2"><b>${t('copyMy')}</b><small>${t('copyMySub')}</small></span></button>
    <button class="xbtn" id="cl">${t('close')}</button>`);
  $('#cl').onclick = closeSheet; $('#cp').onclick = () => copyText(addr());
  $('#lg').onclick = async () => { state.lang = state.lang === 'ru' ? 'en' : 'ru'; api('/lang', { lang: state.lang }).catch(() => {}); closeSheet(); renderHome(); };
}
function scan() {
  if (!tg?.showScanQrPopup) return toast(t('noscan'));
  tg.showScanQrPopup({ text: '' }, (txt) => {
    tg.closeScanQrPopup?.(); let s = String(txt || '').trim();
    const m = s.match(/^ton:\/\/transfer\/([A-Za-z0-9_-]{48})/); if (m) s = m[1];
    if (isTonAddr(s) || s.startsWith('@')) renderSend({ to: s }); else openRedeem(s);
    return true;
  });
}

document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.pbtn,.row,.xbtn,.chip,.rbtn button,.seg button,.qrbtn'); if (!b || b.disabled) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, sp = document.createElement('span');
  sp.className = 'rip'; sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  b.appendChild(sp); setTimeout(() => sp.remove(), 650); tg?.HapticFeedback?.impactOccurred('light');
}, { passive: true });

(async function init() {
  try {
    tg?.BackButton?.onClick?.(() => state.view === 'send' && renderHome());
    state.cfg = await api('/config'); await refresh(); renderHome(); loadRate().then(() => state.view === 'home' && renderHome());
  } catch (e) { $('#app').innerHTML = `<div class="empty" style="margin-top:80px"><h3>${esc(I18N[state.lang]['E_' + e.message] || 'Error')}</h3><p>Open the wallet from the Telegram bot.</p></div>`; }
})();
</script>
