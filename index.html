<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gram Wallet</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#0f1115);
  --card:var(--tg-theme-secondary-bg-color,#181b22);
  --text:var(--tg-theme-text-color,#ffffff);
  --hint:var(--tg-theme-hint-color,#8e95a5);
}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);min-height:100vh}
.blue-card{
  background:linear-gradient(135deg,#0088cc 0%,#0055ff 100%);
  border-radius:20px;
  padding:22px;
  margin-bottom:16px;
  color:#fff;
  box-shadow:0 10px 25px rgba(0,119,255,0.3);
}
.blue-card .lbl{font-size:12px;letter-spacing:0.8px;opacity:0.85;text-transform:uppercase;font-weight:600}
.blue-card .val{font-size:36px;font-weight:800;margin:6px 0 2px;letter-spacing:-0.5px}
.blue-card .usd{font-size:15px;opacity:0.85;font-weight:500;margin-bottom:18px}
.row{display:flex;gap:10px}
button{
  flex:1;
  background:#ffffff;
  color:#0055ff;
  border:none;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:transform .1s;
}
button:active{transform:scale(0.97)}
button.sec{background:rgba(255,255,255,0.18);color:#fff;backdrop-filter:blur(4px)}
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px}
.card .lbl{font-size:13px;color:var(--hint);text-transform:uppercase;font-weight:600}
input{
  width:100%;padding:12px;border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(0,0,0,0.25);color:#fff;
  font-size:15px;margin-bottom:10px;outline:none;
}
input::placeholder{color:rgba(255,255,255,0.6)}
.box{display:none;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.2)}
.box.act{display:block}
.tx{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.tx:last-child{border-bottom:none}
.pos{color:#34c759;font-weight:700}
.neg{color:#ff453a;font-weight:700}
.sub{font-size:12px;color:var(--hint);margin-top:2px}
#msg{text-align:center;font-size:14px;font-weight:600;margin-bottom:10px;min-height:20px}
</style>
</head>
<body>
<div id="msg"></div>

<div class="blue-card">
  <div class="lbl">Ваш баланс</div>
  <div class="val"><span id="bal">—</span> GRAM</div>
  <div class="usd">≈ $<span id="usd">0.00</span></div>
  <div class="row">
    <button onclick="tog('sBox')">Отправить</button>
    <button class="sec" onclick="tog('cBox')">Ввести чек</button>
  </div>
  <div id="sBox" class="box">
    <input id="toU" placeholder="@username или ID получателя">
    <input id="toA" type="number" step="0.01" placeholder="Сумма GRAM">
    <button onclick="send()">Перевести</button>
  </div>
  <div id="cBox" class="box">
    <input id="pCode" placeholder="Введите код чека">
    <button onclick="redeem()">Активировать чек</button>
  </div>
</div>

<div class="card">
  <div class="lbl" style="margin-bottom:8px">История операций</div>
  <div id="list"><div class="sub">Синхронизация с сервером...</div></div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tog(id){
  document.querySelectorAll('.box').forEach(e=>{if(e.id!==id)e.classList.remove('act')});
  document.getElementById(id).classList.toggle('act');
}

function msg(t,err=0){
  const e=document.getElementById('msg');
  e.style.color=err?'#ff453a':'#34c759';
  e.innerText=t;
  setTimeout(()=>{if(e.innerText===t)e.innerText=''},5000);
}

// Если хотите зашить адрес бэкенда прямо в HTML, впишите сюда 'https://ваш-бэкенд'
const FIXED_API = '';
let API = FIXED_API.replace(/\/+$/, '');
if (!API) {
  try {
    const cand = (new URLSearchParams(location.search).get('api') || sessionStorage.getItem('gw_api') || '').replace(/\/+$/, '');
    if (/^https:\/\//i.test(cand)) {
      API = cand;
      sessionStorage.setItem('gw_api', API);
    }
  } catch (e) {}
}

async function api(u, b = null) {
  if (!API) {
    throw new Error('Не задан адрес сервера API (?api=https://...). Запустите бэкенд с HTTPS и передайте API_URL.');
  }
  let r;
  try {
    r = await fetch(API + u, {
      method: b ? 'POST' : 'GET',
      cache: 'no-store',
      headers: {
        'Content-Type': 'application/json',
        'X-Init-Data': (tg && tg.initData) || '',
        'ngrok-skip-browser-warning': '1',
        'cloudflared-skip-browser-warning': '1'
      },
      body: b ? JSON.stringify(b) : null
    });
  } catch (e) {
    throw new Error('Нет связи с сервером кошелька. Проверьте, что бэкенд запущен и доступен по HTTPS.');
  }
  const d = await r.json().catch(() => null);
  if (!d) throw new Error('Сервер вернул не JSON. Проверьте адрес API.');
  if (!r.ok) throw new Error(d.error || 'Ошибка сервера');
  return d;
}

let lastRaw = null, loading = false;
const fmtG = n => (n / 1e9).toLocaleString('ru-RU', { maximumFractionDigits: 4 });

async function load(force = false) {
  if (loading && !force) return;
  loading = true;
  try {
    const initData = tg && tg.initData;
    if (!initData) throw new Error('Откройте кошелёк через кнопку в боте Telegram');
    const d = await api('/api/wallet');
    document.getElementById('bal').innerText = d.balance;
    document.getElementById('usd').innerText = d.usd;
    if (lastRaw !== null && d.balance_raw > lastRaw) {
      msg('💰 Баланс пополнен: +' + fmtG(d.balance_raw - lastRaw) + ' GRAM');
    }
    lastRaw = d.balance_raw;
    document.getElementById('list').innerHTML = d.txs.length
      ? d.txs.map(t => {
          const when = new Date(t.ts * 1000).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
          return `<div class="tx"><div><div>${esc(t.title)}</div><div class="sub">${esc([t.cp, when].filter(Boolean).join(' · '))}</div></div><div class="${t.raw >= 0 ? 'pos' : 'neg'}">${t.raw >= 0 ? '+' : ''}${esc(t.amt)} GRAM</div></div>`;
        }).join('')
      : '<div class="sub">Операций пока нет</div>';
  } catch (e) {
    if (lastRaw === null) {
      document.getElementById('bal').innerText = '!';
    }
    document.getElementById('list').innerHTML = '<div class="sub" style="color:#ff453a">' + esc(e.message) + '</div>';
  } finally {
    loading = false;
  }
}

async function send() {
  try {
    await api('/api/send', { to: document.getElementById('toU').value, amount: document.getElementById('toA').value });
    msg('✅ Перевод выполнен!');
    document.getElementById('toU').value = '';
    document.getElementById('toA').value = '';
    tog('sBox');
    await load(true);
  } catch (e) { msg(e.message, 1); }
}

async function redeem(autoCode = null) {
  const code = autoCode || document.getElementById('pCode').value;
  if (!code) return;
  try {
    const r = await api('/api/redeem', { code: code });
    msg('🎉 Получено +' + r.amount + ' GRAM!');
    if (!autoCode) { document.getElementById('pCode').value = ''; tog('cBox'); }
    await load(true);
  } catch (e) { msg(e.message, 1); await load(true); }
}

(async () => {
  const startParam = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (startParam) { await redeem(startParam); } else { await load(true); }
})();

setInterval(() => { if (!document.hidden) load(); }, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
window.addEventListener('focus', () => { load(true); });
</script>
</body>
</html>
