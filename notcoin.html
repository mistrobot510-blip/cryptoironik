<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NotCoin Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #15171e;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
            --accent-blue: #229ED9; /* Цвет кнопки как на Tonnel */
            --border-color: #232936;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            padding-bottom: 80px;
        }
        
        h2 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
        
        /* Сетка товаров */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        /* Карточка (стиль Tonnel) */
        .card {
            background-color: var(--bg-card);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* Иконки сверху (сердце и корзина) */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
        }
        .icon-btn {
            width: 28px;
            height: 28px;
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        .icon-btn.liked { color: #ff4b4b; }

        /* Картинка */
        .card-img-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            background: radial-gradient(circle, #2a2e38 0%, #15171e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }
        .card-img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        /* Название и номер */
        .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-id {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        /* Кнопка с ценой */
        .btn-price {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            width: 100%;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .btn-price:active { opacity: 0.8; }
        .ton-icon {
            width: 16px;
            height: 16px;
            background-color: white;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-blue);
            font-size: 10px;
            font-weight: 900;
        }

        /* Нижняя панель */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: var(--bg-card);
            display: flex; justify-content: space-around;
            padding: 12px 0 24px 0;
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }
        .nav-item { color: var(--text-muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-weight: 500; }
        .nav-item.active { color: var(--accent-blue); }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>

    <h2>🛍 NotCoin Market</h2>
    <p class="subtitle">Лучшие NFT-подарки</p>

    <div class="grid" id="market-grid"></div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Маркет
        </div>
        <div class="nav-item" onclick="tg.showAlert('Мои NFT в разработке')">
            <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
            Мои NFT
        </div>
        <div class="nav-item" onclick="tg.showAlert('Профиль в разработке')">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Профиль
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0b0e14');
        tg.setBackgroundColor('#0b0e14');

        // БАЗА ТОВАРОВ
        const baseUrl = "https://mistrobot510-blip.github.io/cryptoironik/";
        const gifts = [
            { id: 1, name: "Durov's Cap", num: "#2997", price: 620, img: baseUrl + "DurovsCap-2997.jpg" },
            { id: 2, name: "Astral Shard", num: "#1221", price: 121, img: baseUrl + "AstralShard-1221.jpg" },
            { id: 3, name: "Loot Bag", num: "#9507", price: 97.7, img: baseUrl + "LootBag-9507.jpg" },
            { id: 4, name: "Toy Bear", num: "#32994", price: 59.6, img: baseUrl + "ToyBear-32994.jpg" },
            { id: 5, name: "Diamond Ring", num: "#20493", price: 43.1, img: baseUrl + "DiamondRing-20493.jpg" },
            { id: 6, name: "Mighty Arm", num: "#3719", price: 23.2, img: baseUrl + "MightyArm-3719.jpg" },
            { id: 7, name: "Surge Board", num: "#1090", price: 21.5, img: baseUrl + "SurgeBoard-1090.jpg" },
            { id: 8, name: "Mood Pack", num: "#180789", price: 14, img: baseUrl + "MoodPack-180789.jpg" },
            { id: 9, name: "Lunar Snake", num: "#198046", price: 9.8, img: baseUrl + "LunarSnake-198046.jpg" },
            { id: 10, name: "Bunny Muffin", num: "#50431", price: 8.7, img: baseUrl + "BunnyMuffin-50431.jpg" },
            { id: 11, name: "Snake Box", num: "#165875", price: 5.1, img: baseUrl + "SnakeBox-165875.jpg" },
            { id: 12, name: "Love Potion", num: "#16384", price: 5, img: baseUrl + "LovePotion-16384.jpg" },
            { id: 13, name: "Lol Pop", num: "#232765", price: 5, img: baseUrl + "LolPop-232765.jpg" },
            { id: 14, name: "Candy Cane", num: "#46898", price: 5, img: baseUrl + "CandyCane-46898.jpg" },
            { id: 15, name: "Santa Hat", num: "#67499", price: 5, img: baseUrl + "SantaHat-67499.jpg" },
            { id: 16, name: "Precious Peach", num: "#975", price: 5, img: baseUrl + "PreciousPeach-975.jpg" },
            { id: 17, name: "Star Notepad", num: "#67850", price: 5, img: baseUrl + "StarNotepad-67850.jpg" },
            { id: 18, name: "Winter Wreath", num: "#70288", price: 5, img: baseUrl + "WinterWreath-70288.jpg" },
            { id: 19, name: "Ginger Cookie", num: "#140033", price: 5, img: baseUrl + "GingerCookie-140033.jpg" },
            { id: 20, name: "Pet Snake", num: "#187097", price: 5, img: baseUrl + "PetSnake-187097.jpg" },
            { id: 21, name: "Jester Hat", num: "#132381", price: 5, img: baseUrl + "JesterHat-132381.jpg" },
            { id: 22, name: "Top Hat", num: "#12680", price: 5, img: baseUrl + "TopHat-12680.jpg" }
        ];

        const grid = document.getElementById('market-grid');

        gifts.forEach(gift => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <div class="icon-btn" onclick="this.classList.toggle('liked'); tg.showAlert('Добавлено в избранное')">🤍</div>
                    <div class="icon-btn" onclick="tg.showAlert('Добавлено в корзину')">🛒</div>
                </div>
                <div class="card-img-container">
                    <img src="${gift.img}" class="card-img" alt="${gift.name}" onerror="this.src='https://via.placeholder.com/150?text=NFT'">
                </div>
                <div class="card-title">${gift.name}</div>
                <div class="card-id">${gift.num}</div>
                <button class="btn-price" onclick="tg.showAlert('Для покупки напишите: @cryptoironik')">
                    <div class="ton-icon">▽</div> ${gift.price}
                </button>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
