<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NotCoin Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #15171e;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
            --accent-blue: #229ED9;
            --border-color: #232936;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            padding-bottom: 90px;
        }
        h2 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .card {
            background-color: var(--bg-card);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }
        .card-img-container {
            width: 100%; aspect-ratio: 1 / 1; border-radius: 16px;
            background: radial-gradient(circle, #2a2e38 0%, #15171e 100%);
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 12px;
        }
        .card-img { width: 90%; height: 90%; object-fit: contain; }
        .card-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-id { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
        
        .btn-price {
            background-color: var(--accent-blue); color: white; border: none;
            padding: 12px; border-radius: 12px; width: 100%;
            font-size: 15px; font-weight: 700; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 6px;
        }
        .ton-icon {
            width: 16px; height: 16px; background-color: white; border-radius: 50%;
            display: inline-flex; justify-content: center; align-items: center;
            color: var(--accent-blue); font-size: 10px; font-weight: 900;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: var(--bg-card);
            display: flex; justify-content: space-around;
            padding: 12px 0 24px 0;
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }
        .nav-item { color: var(--text-muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-weight: 500; }
        .nav-item.active { color: var(--accent-blue); }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>

    <div id="page-market" class="page active">
        <h2>🛍 NotCoin Market</h2>
        <p class="subtitle">Лучшие NFT-подарки</p>
        <div class="grid" id="market-grid"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="tg.showAlert('Вы на главной')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Маркет
        </div>
        <div class="nav-item" onclick="tg.showAlert('В разработке')">
            <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
            Хранилище
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0b0e14');
        tg.setBackgroundColor('#0b0e14');

        const baseUrl = "https://mistrobot510-blip.github.io/cryptoironik/";
        const gifts = [
            // СТАРЫЕ
            { name: "Durov's Cap", num: "#2997", price: 620, img: baseUrl + "DurovsCap-2997.jpg" },
            { name: "Astral Shard", num: "#1221", price: 121, img: baseUrl + "AstralShard-1221.jpg" },
            { name: "Loot Bag", num: "#9507", price: 97.7, img: baseUrl + "LootBag-9507.jpg" },
            { name: "Toy Bear", num: "#32994", price: 59.6, img: baseUrl + "ToyBear-32994.jpg" },
            { name: "Diamond Ring", num: "#20493", price: 43.1, img: baseUrl + "DiamondRing-20493.jpg" },
            { name: "Mighty Arm", num: "#3719", price: 23.2, img: baseUrl + "MightyArm-3719.jpg" },
            { name: "Surge Board", num: "#1090", price: 21.5, img: baseUrl + "SurgeBoard-1090.jpg" },
            { name: "Mood Pack", num: "#180789", price: 14, img: baseUrl + "MoodPack-180789.jpg" },
            { name: "Lunar Snake", num: "#198046", price: 9.8, img: baseUrl + "LunarSnake-198046.jpg" },
            { name: "Bunny Muffin", num: "#50431", price: 8.7, img: baseUrl + "BunnyMuffin-50431.jpg" },
            { name: "Snake Box", num: "#165875", price: 5.1, img: baseUrl + "SnakeBox-165875.jpg" },
            { name: "Love Potion", num: "#16384", price: 5, img: baseUrl + "LovePotion-16384.jpg" },
            { name: "Lol Pop", num: "#232765", price: 5, img: baseUrl + "LolPop-232765.jpg" },
            { name: "Candy Cane", num: "#46898", price: 5, img: baseUrl + "CandyCane-46898.jpg" },
            { name: "Santa Hat", num: "#67499", price: 5, img: baseUrl + "SantaHat-67499.jpg" },
            { name: "Precious Peach", num: "#975", price: 5, img: baseUrl + "PreciousPeach-975.jpg" },
            { name: "Star Notepad", num: "#67850", price: 5, img: baseUrl + "StarNotepad-67850.jpg" },
            { name: "Winter Wreath", num: "#70288", price: 5, img: baseUrl + "WinterWreath-70288.jpg" },
            { name: "Ginger Cookie", num: "#140033", price: 5, img: baseUrl + "GingerCookie-140033.jpg" },
            { name: "Pet Snake", num: "#187097", price: 5, img: baseUrl + "PetSnake-187097.jpg" },
            { name: "Jester Hat", num: "#132381", price: 5, img: baseUrl + "JesterHat-132381.jpg" },
            { name: "Top Hat", num: "#12680", price: 5, img: baseUrl + "TopHat-12680.jpg" },
            
            // НОВЫЕ 7 (с твоими ценами)
            { name: "Easter Egg", num: "#126516", price: 56.9, img: baseUrl + "EasterEgg-126516.jpg" },
            { name: "Witch Hat", num: "#13759", price: 32.1, img: baseUrl + "WitchHat-13759.jpg" },
            { name: "Bow Tie", num: "#17696", price: 29.0, img: baseUrl + "BowTie-17696.jpg" },
            { name: "Clover Pin", num: "#135587", price: 22.7, img: baseUrl + "CloverPin-135587.jpg" },
            { name: "Nail Bracelet", num: "#46", price: 240.0, img: baseUrl + "NailBracelet-46.jpg" },
            { name: "Trapped Heart", num: "#777", price: 43.0, img: baseUrl + "TrappedHeart-777.jpg" },
            { name: "Mini Oscar", num: "#1453", price: 87.6, img: baseUrl + "MiniOscar-1453.jpg" }
        ];

        const grid = document.getElementById('market-grid');

        gifts.forEach((gift) => {
            const card = document.createElement('div');
            card.className = 'card';

            const imgContainer = document.createElement('div');
            imgContainer.className = 'card-img-container';
            const img = document.createElement('img');
            img.src = gift.img;
            img.className = 'card-img';
            img.onerror = function() { this.src = 'https://via.placeholder.com/150?text=NFT'; };
            imgContainer.appendChild(img);

            const title = document.createElement('div');
            title.className = 'card-title';
            title.innerText = gift.name;

            const id = document.createElement('div');
            id.className = 'card-id';
            id.innerText = gift.num;

            const btn = document.createElement('button');
            btn.className = 'btn-price';
            btn.innerHTML = `<div class="ton-icon">▽</div> ${gift.price}`;
            
            btn.onclick = function() {
                tg.showAlert("Для покупки этого NFT напишите менеджеру: @cryptoironik");
            };

            card.appendChild(imgContainer);
            card.appendChild(title);
            card.appendChild(id);
            card.appendChild(btn);
            grid.appendChild(card);
        });
    </script>
</body>
</html>
