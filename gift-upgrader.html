<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1433">
<title>Gift Upgrader</title>
<style>
  :root {
    --bg2: #0b0f29; --card: #1a2047; --card2: #222a58; --card3: #2a3366;
    --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
    --text: #eef1ff; --soft: #bdc5ee; --muted: #8791c2;
    --purple: #6d5dfc; --purple2: #8f86ff; --yellow: #f7c948; --yellow2: #ffdd7a;
    --green: #34e0a1; --red: #ff5470; --blue: #3b82ff;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --dial: min(78vw, 310px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg2); color: var(--text); font-family: var(--font); overscroll-behavior: none; }
  body { background: linear-gradient(180deg, #121839 0%, #0d122f 45%, #0a0e26 100%) fixed; user-select: none; -webkit-user-select: none; }
  button { font-family: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--purple2); outline-offset: 2px; }
  img { -webkit-user-drag: none; }
  input { font-family: inherit; }

  /* Ровный контейнер */
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

  /* Шапка */
  .header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 12px 8px; background: linear-gradient(180deg, #11173a 78%, rgba(17,23,58,0)); }
  .logo b { font-size: 23px; font-weight: 900; letter-spacing: -.5px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .logo b i { font-style: normal; color: var(--yellow); }
  .topup { height: 44px; padding: 0 17px; border-radius: 22px; font-weight: 800; font-size: 15px; color: #fff; background: linear-gradient(180deg, #8d8dff, #5b4ff0); border: 1px solid rgba(255,255,255,.28); box-shadow: 0 0 24px rgba(109,93,252,.65), 0 8px 18px rgba(60,40,200,.4), inset 0 1px 0 rgba(255,255,255,.45); transition: transform .12s; }
  .topup:active { transform: scale(.95); }
  .avatar { position: relative; width: 44px; height: 44px; flex: none; border-radius: 50%; }
  .avatar .pic { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font-weight: 800; overflow: hidden; background: linear-gradient(135deg, #3a3f7a, #151a40); border: 2px solid rgba(255,255,255,.85); }
  .avatar .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar .dot { position: absolute; right: -3px; bottom: -2px; width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #9aa0b5 55%, #5c627a); border: 1.5px solid #0f1433; }

  /* Экраны */
  .screens { flex: 1; padding: 0 12px calc(env(safe-area-inset-bottom) + 104px); display: flex; flex-direction: column; position: relative; }
  .screen { display: none; width: 100%; flex-direction: column; }
  .screen.active { display: flex; animation: fadeUp .3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Круг */
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
  .dial { position: relative; width: var(--dial); height: var(--dial); margin-top: 6px; border-radius: 50%; transition: filter .5s; }
  .dial::before { content: ""; position: absolute; inset: 2%; border-radius: 50%; box-shadow: 0 0 60px rgba(75,80,200,.28); transition: box-shadow .5s; pointer-events: none; }
  .dial.spinning::before { box-shadow: 0 0 80px rgba(143,134,255,.6); }
  .dial.win::before { box-shadow: 0 0 90px rgba(52,224,161,.65); }
  .dial.lose::before { box-shadow: 0 0 90px rgba(255,84,112,.55); }
  .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ring-arc { transition: stroke-dasharray .6s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 0 5px rgba(255,205,70,.95)) drop-shadow(0 0 14px rgba(255,170,30,.7)); }
  .pointer { transform: rotate(180deg); transform-origin: 50% 50%; will-change: transform; filter: drop-shadow(0 0 7px rgba(255,205,80,.65)) drop-shadow(0 3px 3px rgba(0,0,0,.55)); }
  .core { position: absolute; inset: 13.5%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 8%; }
  .core-plus { width: 28%; aspect-ratio: 1; min-width: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.2); transition: transform .12s; }
  .core-plus:active { transform: scale(.92); background: rgba(255,255,255,.1); }
  .core-plus svg { width: 46%; height: 46%; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; }
  .core-title { font-weight: 800; font-size: 19px; color: #b9c1ee; line-height: 1.15; }
  .core-title.win { color: var(--green); text-shadow: 0 0 16px rgba(52,224,161,.75); font-size: 21px; }
  .core-title.lose { color: var(--red); text-shadow: 0 0 16px rgba(255,84,112,.7); font-size: 21px; }
  .core-title.run { color: var(--yellow2); animation: blink 1s infinite; }
  .core-target { display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: 100%; }
  .core-target img { width: 30%; min-width: 66px; aspect-ratio: 1; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); animation: pop .45s cubic-bezier(.2,.9,.3,1.4); }
  .core-target b { font-size: 17px; font-weight: 800; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .core-target small { font-size: 13px; font-weight: 700; color: var(--soft); }
  @keyframes pop { from { transform: scale(.4) rotate(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes blink { 50% { opacity: .4; } }
  .chance { margin-top: 12px; font-size: 20px; font-weight: 700; color: var(--soft); display: flex; align-items: baseline; gap: 10px; }
  .chance b { font-size: 31px; font-weight: 800; color: #dfe4ff; letter-spacing: .5px; min-width: 20px; text-align: right; }
  .chance b.hot { color: var(--yellow2); text-shadow: 0 0 14px rgba(247,201,72,.5); }

  /* Карточки */
  .cards { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .gcard { display: flex; flex-direction: column; gap: 7px; min-height: 100px; padding: 11px 12px 12px; border-radius: 22px; text-align: left; background: linear-gradient(180deg, #1c2350, #161c45); border: 1px solid var(--line2); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 8px 18px rgba(0,0,0,.28); transition: transform .12s; min-width: 0; }
  .gcard:active { transform: scale(.97); }
  .gcard.has { border-color: rgba(143,134,255,.7); box-shadow: 0 0 18px rgba(109,93,252,.3), inset 0 1px 0 rgba(255,255,255,.1); }
  .gcard .lbl { font-size: 14px; font-weight: 700; color: var(--soft); }
  .gcard .body { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .gcard .plus { width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.2); }
  .gcard .plus svg { width: 22px; height: 22px; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; }
  .gcard .plus img { width: 40px; height: 40px; object-fit: contain; }
  .gcard .txt { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .gcard .txt b { font-size: 16px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gcard .txt span { font-size: 14px; font-weight: 600; color: var(--muted); }
  .gcard .txt span.gold { color: var(--yellow2); font-weight: 700; }
  .swap { position: absolute; left: 50%; top: 56%; width: 42px; height: 42px; margin: -21px 0 0 -21px; z-index: 3; border-radius: 50%; display: grid; place-items: center; background: #1f2757; border: 3px solid #0f1433; box-shadow: 0 0 0 1px var(--line2), 0 6px 14px rgba(0,0,0,.45); transition: transform .12s; }
  .swap:active { transform: scale(.88) rotate(180deg); }
  .swap svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  /* Множители */
  .qrow { display: flex; align-items: center; gap: 9px; margin: 14px -12px 0 0; overflow-x: auto; scrollbar-width: none; padding: 4px 12px 6px 0; }
  .qrow::-webkit-scrollbar { display: none; }
  .qb { flex: none; height: 46px; min-width: 48px; padding: 0 14px; border-radius: 16px; display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #d4daff; background: linear-gradient(180deg, #1d2452, #161c45); border: 1px solid var(--line2); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 5px 12px rgba(0,0,0,.25); transition: transform .12s; }
  .qb:active { transform: scale(.93); }
  .qb.on { color: #fff; background: linear-gradient(180deg, #8d86ff, #5b4ff0); border-color: rgba(255,255,255,.3); box-shadow: 0 0 18px rgba(109,93,252,.6), inset 0 1px 0 rgba(255,255,255,.4); }
  .qb svg { width: 22px; height: 22px; }

  .mrow { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .mchip { flex: none; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 10px 0 5px; border-radius: 26px; background: linear-gradient(180deg, #1b2250, #141a40); border: 1px solid var(--line2); }
  .mpill { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px 0 11px; border-radius: 20px; font-weight: 800; font-size: 16px; color: #2c1f00; background: linear-gradient(180deg, #ffe38c, #f5b72a); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 3px 8px rgba(247,180,40,.35); transition: filter .2s; }
  .mpill.off { filter: grayscale(.85) brightness(.8) opacity(.85); }
  .rangewrap { flex: 1; min-width: 0; position: relative; }
  .range { -webkit-appearance: none; appearance: none; width: 100%; height: 50px; margin: 0; background: transparent; touch-action: pan-y; }
  .range::-webkit-slider-runnable-track { height: 14px; border-radius: 99px; background: linear-gradient(90deg, #6d5dfc var(--p, 0%), #1a2047 var(--p, 0%)); box-shadow: inset 0 2px 4px rgba(0,0,0,.5); }
  .range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 48px; height: 48px; margin-top: -17px; border-radius: 50%; border: 6px solid rgba(255,255,255,.3); background: #4d4d55; box-shadow: 0 4px 12px rgba(0,0,0,.55); }

  .hint { margin-top: 10px; padding: 19px 14px; border-radius: 20px; text-align: center; font-size: 17px; font-weight: 600; color: #aab3e0; line-height: 1.3; background: linear-gradient(180deg, #1b2250, #151b44); border: 1px solid var(--line2); }
  .hint b { color: #fff; }
  .hint em { font-style: normal; color: var(--yellow2); font-weight: 800; }

  .go { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 76px; margin-top: 10px; border-radius: 22px; color: #8c96c8; background: linear-gradient(180deg, #1b2250, #151b44); border: 1px solid var(--line2); transition: transform .12s; }
  .go .row { display: flex; align-items: center; gap: 10px; font-size: 25px; font-weight: 800; }
  .go .row svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .go small { font-size: 16px; font-weight: 600; opacity: .9; }
  .go:disabled { cursor: not-allowed; }
  .go:not(:disabled) { color: #fff; background: linear-gradient(180deg, #918aff, #5648f0); border-color: rgba(255,255,255,.3); box-shadow: 0 0 30px rgba(109,93,252,.75), inset 0 1px 0 rgba(255,255,255,.5); }
  .go:not(:disabled):active { transform: scale(.96); }

  /* Нижнее меню */
  .nav { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 10px); transform: translateX(-50%); z-index: 25; width: min(456px, calc(100% - 24px)); display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 6px; border-radius: 34px; background: rgba(20,26,64,.94); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 14px 34px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .nav button { position: relative; height: 52px; border-radius: 28px; font-size: 16px; font-weight: 800; color: #cdd3f6; transition: background .25s, color .25s, transform .12s; }
  .nav button.on { color: #fff; background: linear-gradient(180deg, #3a3290, #2a2470); border: 1px solid rgba(160,150,255,.55); box-shadow: 0 0 16px rgba(109,93,252,.45); }

  /* Модалки */
  .overlay { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: center; background: rgba(5,7,22,.72); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .overlay.sheet { align-items: flex-end; }
  .overlay.modal { align-items: center; padding: 20px; }
  .panel { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: linear-gradient(180deg, #1e2655, #141a42); border: 1px solid var(--line2); box-shadow: 0 -10px 40px rgba(0,0,0,.5); }
  .panel.sheet { border-radius: 28px 28px 0 0; padding: 10px 16px calc(env(safe-area-inset-bottom) + 18px); transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.9,.3,1); }
  .overlay.open .panel.sheet { transform: none; }
  .panel.modal { max-width: 380px; border-radius: 28px; padding: 24px 20px 20px; transform: scale(.9); opacity: 0; transition: all .3s cubic-bezier(.2,.9,.3,1.2); }
  .overlay.open .panel.modal { transform: none; opacity: 1; }
  .grab { width: 44px; height: 5px; border-radius: 99px; background: rgba(255,255,255,.2); margin: 0 auto 10px; }
  .sh-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sh-head h3 { margin: 0; font-size: 21px; font-weight: 800; }
  .x { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); font-size: 15px; }
  
  .field { width: 100%; height: 50px; padding: 0 16px; border-radius: 16px; font-size: 16px; font-weight: 700; color: #fff; background: #0d1233; border: 1px solid var(--line2); outline: none; user-select: text; -webkit-user-select: text; }
  .field:focus { border-color: var(--purple2); box-shadow: 0 0 0 3px rgba(109,93,252,.25); }
  .chips { display: flex; gap: 8px; margin: 10px 0 14px; }
  .chips button { flex: 1; height: 42px; border-radius: 14px; font-weight: 800; background: #232b5c; border: 1px solid var(--line2); transition: transform .12s; }
  .chips button:active { transform: scale(.93); }
  .btn { height: 48px; border-radius: 16px; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s; width: 100%; }
  .btn:active { transform: scale(.95); }
  .btn.pri { color: #fff; background: linear-gradient(180deg, #8d8dff, #5b4ff0); border: 1px solid rgba(255,255,255,.28); box-shadow: 0 0 18px rgba(109,93,252,.5); }
  .btn.sec { color: #dfe4ff; background: linear-gradient(180deg, #232b5c, #1a2150); border: 1px solid var(--line2); }
  
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translate(-50%, 14px); z-index: 90; max-width: 90vw; padding: 12px 18px; border-radius: 16px; font-size: 14px; font-weight: 700; text-align: center; background: rgba(32,40,92,.97); border: 1px solid rgba(160,150,255,.5); box-shadow: 0 10px 28px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: all .28s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Профиль */
  .pf-hero { margin-top: 8px; padding: 22px 16px 18px; border-radius: 28px; text-align: center; background: radial-gradient(240px 140px at 50% 0%, rgba(109,93,252,.45), transparent 70%), linear-gradient(180deg, #1d2552, #151b45); border: 1px solid var(--line2); }
  .pf-ava { position: relative; width: 96px; height: 96px; margin: 0 auto 12px; border-radius: 50%; padding: 4px; background: conic-gradient(from 0deg, #8f86ff, #3b82ff, #34e0a1, #f7c948, #8f86ff); }
  .pf-ava .pic { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; overflow: hidden; font-size: 34px; font-weight: 800; background: linear-gradient(135deg, #3a3f7a, #151a40); border: 3px solid #151b45; }
  .pf-ava .pic img { width: 100%; height: 100%; object-fit: cover; }
  .pf-name { font-size: 22px; font-weight: 800; }
  .pf-user { margin-top: 2px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .wallet { margin-top: 12px; padding: 16px; border-radius: 24px; background: linear-gradient(180deg, #1c2350, #161c45); border: 1px solid var(--line2); }
  .wallet .top { display: flex; align-items: center; gap: 12px; }
  .wallet .big { font-size: 30px; font-weight: 900; line-height: 1; }
  .wallet .sub { font-size: 14px; font-weight: 600; color: var(--muted); margin-top: 4px; }
  .wallet .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .stat { padding: 14px; border-radius: 20px; background: linear-gradient(180deg, #1b2250, #151b44); border: 1px solid var(--line2); }
  .stat span { display: block; font-size: 13px; font-weight: 700; color: var(--muted); }
  .stat b { display: block; margin-top: 4px; font-size: 24px; font-weight: 900; }
  .stat b.g { color: var(--green); } .stat b.r { color: var(--red); } .stat b.y { color: var(--yellow2); }
  
  .empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 15px; font-weight: 600; line-height: 1.4; }
  .res { text-align: center; }
  .res .t { font-size: 32px; font-weight: 900; }
  .res.win .t { color: var(--green); text-shadow: 0 0 24px rgba(52,224,161,.7); }
  .res.lose .t { color: var(--red); text-shadow: 0 0 24px rgba(255,84,112,.6); }
  .res img { width: 110px; height: 110px; object-fit: contain; margin: 10px 0 6px; animation: pop .6s cubic-bezier(.2,.9,.3,1.4); }
  .res p { margin: 0 0 18px; color: var(--soft); font-size: 15px; font-weight: 600; line-height: 1.4; }

  @media (max-width: 370px) { .logo b { font-size: 20px; } .topup { padding: 0 12px; font-size: 14px; } .header { gap: 6px; } .chance b { font-size: 27px; } }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="app">

  <!-- ===== Шапка ===== -->
  <header class="header">
    <div class="logo">
      <b>Gift<i>UP</i></b>
    </div>
    <button class="topup" data-act="topup">Пополнить</button>
    <button class="avatar" data-act="nav" data-v="profile" aria-label="Профиль"><span class="pic" id="hdrAva">?</span><span class="dot"></span></button>
  </header>

  <main class="screens">

    <!-- ===== ИГРА ===== -->
    <section class="screen active" id="screen-game">
      <div class="stage">
        <div class="dial" id="dial">
          <svg viewBox="0 0 440 440" aria-hidden="true">
            <defs>
              <radialGradient id="disc" cx="50%" cy="34%" r="72%"><stop offset="0" stop-color="#1a2150"/><stop offset=".6" stop-color="#11173d"/><stop offset="1" stop-color="#0a0e29"/></radialGradient>
              <radialGradient id="outer" cx="50%" cy="50%" r="50%"><stop offset=".86" stop-color="#151b45"/><stop offset="1" stop-color="#10153a"/></radialGradient>
              <linearGradient id="ringG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#454c78"/><stop offset=".55" stop-color="#363d68"/><stop offset="1" stop-color="#2b3158"/></linearGradient>
              <linearGradient id="arcG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f5a623"/></linearGradient>
              <linearGradient id="arL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffefb8"/><stop offset="1" stop-color="#f7cf62"/></linearGradient>
              <linearGradient id="arR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9b445"/><stop offset="1" stop-color="#c98a1c"/></linearGradient>
            </defs>
            <circle cx="220" cy="220" r="219" fill="url(#outer)" stroke="rgba(255,255,255,.07)" stroke-width="1.5"/>
            <g id="ticks"></g>
            <circle cx="220" cy="220" r="192" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1.2"/>
            <circle cx="220" cy="220" r="178.5" fill="none" stroke="url(#ringG)" stroke-width="27"/>
            <circle cx="220" cy="220" r="165" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="2"/>
            <circle class="ring-arc" id="arc" cx="220" cy="220" r="178.5" fill="none" stroke="url(#arcG)" stroke-width="12" transform="rotate(-90 220 220)" stroke-dasharray="0 1122"/>
            <circle cx="220" cy="220" r="163" fill="url(#disc)" stroke="rgba(255,255,255,.22)" stroke-width="1.6"/>
            <circle cx="220" cy="220" r="158" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="5"/>
          </svg>
          <svg class="pointer" id="pointer" viewBox="0 0 440 440" aria-hidden="true">
