<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gift Upgrader</title>
<style>
  :root {
    --navy-0: #04071c;
    --navy-1: #081043;
    --navy-2: #0f1f6b;
    --blue: #2f7bff;
    --blue-edge: #1a3fa8;
    --blue-hi: #6aa8ff;
    --yellow: #ffd23f;
    --yellow-hi: #fff2a6;
    --yellow-edge: #b87a00;
    --track: #2b3358;
    --text: #eef2ff;
    --muted: #8d98c9;
    --green: #35f5a0;
    --red: #ff4d6d;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --dial: min(80vw, 316px, 40vh);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--navy-0); color: var(--text); font-family: var(--font); overscroll-behavior: none; }
  body {
    background:
      radial-gradient(700px 420px at 50% 30%, rgba(47,123,255,.28), transparent 65%),
      radial-gradient(600px 400px at 100% 100%, rgba(120,60,255,.22), transparent 60%),
      /* лёгкий изометрический 3D-паттерн */
      repeating-linear-gradient(30deg, rgba(255,255,255,.028) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(150deg, rgba(255,255,255,.028) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 30px),
      linear-gradient(180deg, var(--navy-2) 0%, var(--navy-1) 45%, var(--navy-0) 100%);
    background-attachment: fixed;
    user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }

  .app { min-height: 100vh; min-height: 100dvh; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 16px); }

  /* ---------- 3D кнопка ---------- */
  .b3d { --face-a: #5aa0ff; --face-b: #2f6bff; --edge: var(--blue-edge); --glow: rgba(47,123,255,.55);
    position: relative; border-radius: 14px; font-weight: 800; color: #fff;
    background: linear-gradient(180deg, var(--face-a), var(--face-b));
    box-shadow: 0 5px 0 var(--edge), 0 10px 22px var(--glow), inset 0 2px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.18);
    transition: transform .12s, box-shadow .12s, filter .2s; }
  .b3d:active:not(:disabled) { transform: translateY(4px) scale(.95); box-shadow: 0 1px 0 var(--edge), 0 4px 10px var(--glow), inset 0 2px 0 rgba(255,255,255,.35); }
  .b3d:disabled { filter: grayscale(.85) brightness(.55); cursor: not-allowed; box-shadow: 0 5px 0 #20243f, inset 0 2px 0 rgba(255,255,255,.12); }

  /* ---------- Верхняя панель ---------- */
  .topbar { display: flex; align-items: center; gap: 8px; }
  .logo { display: flex; align-items: center; gap: 7px; flex: none; }
  .logo svg { width: 34px; height: 34px; filter: drop-shadow(0 0 8px rgba(106,168,255,.8)); }
  .logo span { font-weight: 900; font-style: italic; font-size: 17px; letter-spacing: .3px; background: linear-gradient(180deg, #fff, var(--blue-hi)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .balance { display: flex; align-items: center; gap: 5px; margin-left: auto; padding: 8px 12px; border-radius: 12px; font-weight: 800; font-size: 15px; background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 6px 14px rgba(0,0,0,.35); white-space: nowrap; }
  .balance b { color: var(--yellow); text-shadow: 0 0 10px rgba(255,210,63,.6); }
  .topup { padding: 9px 14px; font-size: 14px; }
  .avatar { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; overflow: hidden; background: linear-gradient(135deg, #7a4dff, #2f7bff); box-shadow: 0 0 0 2px var(--navy-1), 0 0 0 3.5px var(--blue-hi), 0 0 16px rgba(106,168,255,.6); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 380px) { .logo span { display: none; } }

  /* ---------- Круг ---------- */
  .stage { display: flex; flex-direction: column; align-items: center; margin: 18px 0 6px; }
  .dial { position: relative; width: var(--dial); height: var(--dial); border-radius: 50%;
    background: conic-gradient(from 210deg, #7fb4ff, #24379c 18%, #0a1242 40%, #1a2b86 62%, #7fb4ff 85%, #7fb4ff);
    box-shadow: 0 34px 60px rgba(0,0,0,.65), 0 0 70px rgba(47,123,255,.38), inset 0 3px 2px rgba(255,255,255,.5), inset 0 -8px 14px rgba(0,0,0,.55);
    transition: box-shadow .5s; }
  .dial.win { box-shadow: 0 34px 60px rgba(0,0,0,.65), 0 0 90px rgba(53,245,160,.65), inset 0 3px 2px rgba(255,255,255,.5), inset 0 -8px 14px rgba(0,0,0,.55); }
  .dial.lose { box-shadow: 0 34px 60px rgba(0,0,0,.65), 0 0 90px rgba(255,77,109,.6), inset 0 3px 2px rgba(255,255,255,.5), inset 0 -8px 14px rgba(0,0,0,.55); }
  .well { position: absolute; inset: 3.4%; border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, #17236f 0%, #0a1042 55%, #050827 100%);
    box-shadow: inset 0 14px 30px rgba(0,0,0,.85), inset 0 -6px 16px rgba(110,160,255,.22); }
  .ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ring-track { fill: none; stroke: var(--track); stroke-width: 14; }
  .ring-fill { fill: none; stroke: var(--yellow); stroke-width: 14; stroke-linecap: butt; transition: stroke-dasharray .6s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 0 5px rgba(255,210,63,.95)) drop-shadow(0 0 14px rgba(255,190,30,.75)); }
  .pointer { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(180deg); transform-origin: 50% 50%; filter: drop-shadow(0 0 8px rgba(255,210,63,.95)) drop-shadow(0 3px 3px rgba(0,0,0,.6)); will-change: transform; pointer-events: none; }
  .core { position: absolute; inset: 20%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 10px;
    background: linear-gradient(160deg, rgba(255,255,255,.2), rgba(255,255,255,.04) 55%, rgba(255,255,255,.08));
    border: 1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: inset 0 2px 1px rgba(255,255,255,.35), inset 0 -10px 22px rgba(0,0,0,.4), 0 12px 24px rgba(0,0,0,.45); }
  .core-plus { width: 26%; aspect-ratio: 1; min-width: 46px; border-radius: 50%; font-size: 34px; line-height: 1; padding-bottom: 3px; display: grid; place-items: center; }
  .core-text { font-weight: 800; font-size: 15px; line-height: 1.15; max-width: 100%; overflow-wrap: anywhere; }
  .core-text.win { color: var(--green); text-shadow: 0 0 14px rgba(53,245,160,.8); font-size: 17px; }
  .core-text.lose { color: var(--red); text-shadow: 0 0 14px rgba(255,77,109,.8); font-size: 17px; }
  .chance-text { margin-top: 20px; font-weight: 900; font-size: 24px; letter-spacing: .3px; text-shadow: 0 0 16px rgba(255,210,63,.45); }
  .chance-text b { color: var(--yellow); }

  /* ---------- Выбор подарков ---------- */
  .picks { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
  .pick { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; max-width: 150px; }
  .pick label { font-size: 13px; font-weight: 700; color: var(--muted); }
  .tile { width: 100%; aspect-ratio: 1.15; max-height: 108px; border-radius: 18px; display: grid; place-items: center; font-size: 40px; font-weight: 800; padding: 6px; text-align: center; line-height: 1.1;
    --face-a: rgba(255,255,255,.2); --face-b: rgba(255,255,255,.06); --edge: #0a0f33; --glow: rgba(47,123,255,.25);
    background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.06)); border: 1px solid rgba(255,255,255,.2);
    box-shadow: 0 6px 0 #0a0f33, 0 14px 24px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.35); }
  .tile:active { transform: translateY(5px) scale(.95); box-shadow: 0 1px 0 #0a0f33, 0 4px 10px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.25); }
  .tile .nm { font-size: 14px; color: var(--yellow); text-shadow: 0 0 10px rgba(255,210,63,.5); }
  .arrow { font-size: 30px; font-weight: 900; color: var(--blue-hi); text-shadow: 0 0 14px rgba(106,168,255,.9); margin-top: 22px; flex: none; }

  /* ---------- Множители ---------- */
  .mults { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; margin-top: 20px; }
  .mult { height: 54px; font-size: 18px; border-radius: 14px; display: grid; place-items: center;
    --face-a: #3b4a9c; --face-b: #243076; --edge: #0f1650; --glow: rgba(60,80,200,.35); }
  .mult.sel { --face-a: var(--yellow-hi); --face-b: var(--yellow); --edge: var(--yellow-edge); --glow: rgba(255,210,63,.75); color: #2a1c00; }
  .mult svg { width: 26px; height: 26px; }

  /* ---------- Улучшить ---------- */
  .spacer { flex: 1; min-height: 14px; }
  .go { width: 100%; padding: 18px 20px; font-size: 22px; letter-spacing: .6px; border-radius: 18px; margin-top: 6px;
    --face-a: #6aa8ff; --face-b: #2f6bff; --edge: var(--blue-edge); --glow: rgba(47,123,255,.7); }
  .go.ready { animation: breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 5px 0 var(--edge), 0 12px 34px rgba(47,123,255,.95), inset 0 2px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.18); } }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); transform: translate(-50%, 16px); padding: 11px 16px; border-radius: 12px; font-size: 13px; background: rgba(10,16,67,.95); border: 1px solid var(--blue-hi); box-shadow: 0 0 20px rgba(47,123,255,.5); opacity: 0; pointer-events: none; transition: all .3s; max-width: 92vw; text-align: center; z-index: 10; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="app">

  <!-- Верхняя панель -->
  <header class="topbar">
    <div class="logo" aria-label="Gift Upgrader">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe0ff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient>
          <linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a6"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
        </defs>
        <rect x="3" y="3" width="34" height="34" rx="10" fill="url(#lg1)"/>
        <path d="M20 9 L29 20 L24 20 L24 31 L16 31 L16 20 L11 20 Z" fill="url(#lg2)"/>
      </svg>
      <span>Upgrader</span>
    </div>
    <div class="balance">⭐ <b id="balance">0</b></div>
    <button class="b3d topup" id="topupBtn">Пополнить</button>
    <div class="avatar" id="avatar">?</div>
  </header>

  <!-- Главный круг -->
  <section class="stage">
    <div class="dial" id="dial">
      <div class="well"></div>
      <svg class="ring" viewBox="0 0 300 300" aria-hidden="true">
        <circle class="ring-track" cx="150" cy="150" r="130"/>
        <circle class="ring-fill" id="ringFill" cx="150" cy="150" r="130" transform="rotate(-90 150 150)" stroke-dasharray="0 817"/>
      </svg>
      <svg class="pointer" id="pointer" viewBox="0 0 300 300" aria-hidden="true">
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a6"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
        </defs>
        <polygon points="150,32 135,63 165,63" fill="url(#goldGrad)" stroke="#fff6c2" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <div class="core">
        <button class="b3d core-plus" id="corePlus" aria-label="Выбрать цель">+</button>
        <div class="core-text" id="coreText">Выберите цель</div>
      </div>
    </div>
    <div class="chance-text">Шанс <b id="chanceNum">0</b> %</div>
  </section>

  <!-- Блоки выбора -->
  <section class="picks">
    <div class="pick">
      <label>Ваш подарок</label>
      <button class="tile" id="myGiftBtn" aria-label="Выбрать свой подарок">+</button>
    </div>
    <div class="arrow">→</div>
    <div class="pick">
      <label>Хочу получить</label>
      <button class="tile" id="targetBtn" aria-label="Выбрать цель">+</button>
    </div>
  </section>

  <!-- Множители -->
  <section class="mults" id="mults">
    <button class="b3d mult" data-val="2">x2</button>
    <button class="b3d mult" data-val="3">x3</button>
    <button class="b3d mult" data-val="4">x4</button>
    <button class="b3d mult" data-val="5">x5</button>
    <button class="b3d mult" id="giftIconBtn" aria-label="Выбрать подарок">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12"/>
        <path d="M12 8c-1.5-3-5-3.5-5-1.2C7 8 9 8 12 8zM12 8c1.5-3 5-3.5 5-1.2C17 8 15 8 12 8z"/>
      </svg>
    </button>
  </section>

  <div class="spacer"></div>
  <button class="b3d go" id="goBtn" disabled>Улучшить</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= Данные ================= */
const multipliers = [{val: 2, chance: 50}, {val: 3, chance: 33}, {val: 4, chance: 25}, {val: 5, chance: 15}];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const RING_LEN = 2 * Math.PI * 130;

const state = { mult: null, myGift: null, target: null, spinning: false };
let angle = 180;          // текущий угол указателя (0 = верх, по часовой), старт — внизу
let shownChance = 0;      // для плавного счётчика

/* ================= Telegram (подключается после загрузки страницы) ================= */
let tg = null;
function initTelegram() {
  if (tg || !(window.Telegram && window.Telegram.WebApp)) return;
  tg = window.Telegram.WebApp;
  try { tg.ready(); tg.expand(); tg.setHeaderColor('#081043'); tg.setBackgroundColor('#04071c'); } catch (e) {}
  loadUser();
  loadParams();
  render();
}
function inTelegram() { return !!(tg && tg.initData); }
function loadTelegramScript() {
  const s = document.createElement('script');
  s.src = 'https://telegram.org/js/telegram-web-app.js';
  s.onload = initTelegram;
  document.head.appendChild(s);
}
if (document.readyState === 'complete') loadTelegramScript();
else window.addEventListener('load', loadTelegramScript);

function haptic(kind) {
  try {
    if (tg && tg.HapticFeedback) {
      if (kind === 'win') tg.HapticFeedback.notificationOccurred('success');
      else if (kind === 'lose') tg.HapticFeedback.notificationOccurred('error');
      else tg.HapticFeedback.impactOccurred('light');
    } else if (navigator.vibrate) {
      navigator.vibrate(kind === 'win' ? [60, 40, 120] : kind === 'lose' ? [200] : 12);
    }
  } catch (e) {}
}
function sendToBot(payload) {
  console.log('sendData', payload);
  if (inTelegram()) { try { tg.sendData(JSON.stringify(payload)); } catch (e) {} return true; }
  showToast('Демо-режим · отправка: ' + JSON.stringify(payload));
  return false;
}

/* ================= Звук ================= */
let audioCtx = null;
function beep(freqs, step, type) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    freqs.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + i * step);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + i * step + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * step + step * 1.6);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0 + i * step); o.stop(t0 + i * step + step * 1.7);
    });
  } catch (e) {}
}

/* ================= Пользователь и параметры ================= */
function loadUser() {
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const name = (u && (u.first_name || u.username)) || 'Игрок';
  const el = $('avatar');
  el.innerHTML = '';
  if (u && u.photo_url) {
    const img = document.createElement('img');
    img.alt = '';
    img.onerror = () => { el.textContent = name[0].toUpperCase(); };
    img.src = u.photo_url;
    el.appendChild(img);
  } else {
    el.textContent = name[0].toUpperCase();
  }
}
/* Бот может открыть апп со ссылкой вида:
   index.html?balance=120&my=Мишка&target=Корона&mult=3
   (выбранные ранее подарки, баланс и множитель) */
function loadParams() {
  const q = new URLSearchParams(location.search);
  if (q.get('balance') !== null) $('balance').textContent = Math.max(0, parseInt(q.get('balance'), 10) || 0);
  state.myGift = q.get('my') || state.myGift;
  state.target = q.get('target') || state.target;
  const m = multipliers.find(x => String(x.val) === q.get('mult'));
  if (m) state.mult = m;
}

/* ================= Рендер ================= */
function setChanceNumber(to) {
  const from = shownChance, t0 = performance.now(), dur = 450;
  function step(now) {
    const k = Math.min(1, (now - t0) / dur);
    shownChance = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    $('chanceNum').textContent = shownChance;
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function render() {
  const chance = state.mult ? state.mult.chance : 0;
  $('ringFill').setAttribute('stroke-dasharray', (chance / 100 * RING_LEN) + ' ' + RING_LEN);
  setChanceNumber(chance);

  document.querySelectorAll('.mult[data-val]').forEach(b => {
    b.classList.toggle('sel', !!state.mult && +b.dataset.val === state.mult.val);
    b.disabled = state.spinning;
  });
  $('giftIconBtn').disabled = state.spinning;
  $('topupBtn').disabled = state.spinning;
  $('corePlus').disabled = state.spinning;
  $('myGiftBtn').disabled = state.spinning;
  $('targetBtn').disabled = state.spinning;

  $('myGiftBtn').innerHTML = state.myGift ? '<span class="nm">' + esc(state.myGift) + '</span>' : '+';
  $('targetBtn').innerHTML = state.target ? '<span class="nm">' + esc(state.target) + '</span>' : '+';

  const ct = $('coreText');
  if (!state.spinning && !ct.dataset.result) {
    ct.className = 'core-text';
    ct.textContent = state.target ? state.target : 'Выберите цель';
  }

  const ready = !!(state.myGift && state.mult && !state.spinning);
  $('goBtn').disabled = !ready;
  $('goBtn').classList.toggle('ready', ready);
}

/* ================= Действия ================= */
function actionMyGift() {
  haptic();
  if (!sendToBot({ action: 'choose_my_gift' })) { state.myGift = state.myGift ? null : 'Мишка'; render(); }
}
function actionTarget() {
  haptic();
  if (!sendToBot({ action: 'choose_target' })) { state.target = state.target ? null : 'Корона'; render(); }
}
$('topupBtn').onclick = () => { haptic(); sendToBot({ action: 'topup' }); };
$('myGiftBtn').onclick = actionMyGift;
$('targetBtn').onclick = actionTarget;
$('corePlus').onclick = actionTarget;
$('giftIconBtn').onclick = actionTarget;

document.querySelectorAll('.mult[data-val]').forEach(b => {
  b.onclick = () => {
    if (state.spinning) return;
    const m = multipliers.find(x => x.val === +b.dataset.val);
    state.mult = (state.mult && state.mult.val === m.val) ? null : m;
    haptic();
    render();
  };
});

/* ================= Улучшение ================= */
function upgrade() {
  if (state.spinning || !state.myGift || !state.mult) return;
  const mult = state.mult;
  state.spinning = true;
  delete $('coreText').dataset.result;
  $('dial').classList.remove('win', 'lose');
  $('coreText').className = 'core-text';
  $('coreText').textContent = 'Крутим…';
  render();

  // Случайный угол остановки: шанс попадания = доле жёлтой зоны
  const finalDeg = Math.random() * 360;
  const cur = ((angle % 360) + 360) % 360;
  const delta = ((finalDeg - cur) + 360) % 360;
  angle += 360 * 6 + delta;

  const p = $('pointer');
  p.style.transition = 'none';
  void p.offsetWidth;
  p.style.transition = 'transform 3000ms cubic-bezier(.1,.55,.12,1)';
  p.style.transform = 'rotate(' + angle + 'deg)';

  const tick = setInterval(() => haptic(), 140);
  setTimeout(() => clearInterval(tick), 2500);

  setTimeout(() => {
    const win = finalDeg < mult.chance * 3.6;
    haptic(win ? 'win' : 'lose');
    if (win) beep([523, 659, 784, 1047], 0.11, 'triangle'); else beep([330, 262, 196], 0.14, 'sawtooth');

    $('dial').classList.add(win ? 'win' : 'lose');
    const ct = $('coreText');
    ct.dataset.result = '1';
    ct.className = 'core-text ' + (win ? 'win' : 'lose');
    ct.textContent = win ? 'Вы выиграли!' : 'Вы проиграли';

    // результат боту (в Telegram мини-апп после sendData закроется)
    setTimeout(() => sendToBot({ action: 'spin_result', win: win, multiplier: mult.val }), 1800);

    // демо-режим / если приложение осталось открытым — возвращаем в исходное состояние
    setTimeout(() => {
      p.style.transition = 'none';
      angle = ((angle % 360) + 360) % 360;
      p.style.transform = 'rotate(' + angle + 'deg)';
      delete ct.dataset.result;
      $('dial').classList.remove('win', 'lose');
      state.spinning = false;
      render();
    }, 3200);
  }, 3050);
}
$('goBtn').onclick = upgrade;

/* ================= Тост ================= */
let toastTimer;
function showToast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ================= Старт ================= */
loadUser();
loadParams();
render();
</script>
